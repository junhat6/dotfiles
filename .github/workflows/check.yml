name: Dotfiles checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell and Git configuration syntax
        run: bash .config/dotfiles/scripts/check.sh "$GITHUB_WORKSPACE"
