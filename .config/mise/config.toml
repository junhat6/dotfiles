[tools]
go = "latest"
node = "lts"
rust = "latest"
uv = "latest"

# 共通環境は毎朝自動更新。プロジェクトで必要な版は各リポジトリで指定する。
gh = "latest"
ghq = "latest"
lazygit = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
delta = "latest"
cmake = "latest"
"npm:czg" = "latest"
"github:openclaw/gogcli" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"cargo:mdbook-plantuml" = "latest"

"aqua:anthropics/claude-code" = { version = "latest", minimum_release_age = "0s" }
# Codex は aqua 経由で Apple Silicon 用を取得し、公開後 1 時間待つ。
"aqua:openai/codex" = { version = "latest", minimum_release_age = "1h", os = ["macos/arm64"] }
"npm:cf" = "latest"
python = "latest"
ruby = "latest"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:agent-browser" = { version = "latest", allow_builds = ["agent-browser"] }
pnpm = "11.28.9"
"aqua:google-antigravity/antigravity-cli" = "latest"

[settings]
legacy_version_file = true
