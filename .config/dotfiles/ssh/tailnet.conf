# Macs on the tailnet, for people and AI agents (`ssh macbook-raw hostname`).
# Included from ~/.ssh/config by `dotfiles converge`; keys and known_hosts stay local.
# Short MagicDNS names resolve only inside the tailnet.
Host macbook-raw
    HostName junhat6s-macbook-air
Host mac-mini-raw
    HostName junhat6mac-mini

Host macbook-raw mac-mini-raw
    User junhat6
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
    # Fail fast instead of waiting for a password prompt or a dead host.
    BatchMode yes
    ConnectTimeout 10
    ServerAliveInterval 30
    ServerAliveCountMax 3
    # Agents run many short commands; reuse one connection for 10 minutes.
    ControlMaster auto
    ControlPath ~/.ssh/cm-%C
    ControlPersist 10m
